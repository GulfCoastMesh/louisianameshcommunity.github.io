site_name: Gulf Coast Mesh Docs
site_url: https://docs.louisianamesh.org/
theme:
  name: material
  custom_dir: overrides
  palette:
    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: light green
      accent: deep orange

    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: light green
      accent: deep purple

nav:
  - Home: index.md
  - Local Settings and Information:
      - Meshcore Frequency's: freq-settings.md
      - Meshcore Channel's: channels.md
  - Hardware & Guides:
      - What Device should I buy?: devicerecs.md
      - What Antenna should I use?: antenna.md
      - Our Standard repeater build: diy-repeater-builds.md
  - Setup Guides:
      - Setting up a Meshcore Companion: setting-up-meshcore-companion.md
      - How to setup a Meshcore Repeater: meshcore-repeater-setup.md
  - Tips & Tricks:
      - How to change repeater public key: change-repeater-public-key.md
      - Estimate coverage with Meshmapper: estimate-coverage-with-meshmapper.md
  - Community Transparency: transparency.md

extra:
  analytics:
    provider: custom
    property: "101506271"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/LouisianaMeshCommunity

    - icon: fontawesome/brands/discord
      link: https://discord.louisianamesh.org

    - icon: fontawesome/solid/hand-holding-usd
      link: https://ko-fi.com/louisianameshcommunity
